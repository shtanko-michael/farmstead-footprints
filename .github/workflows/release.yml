name: Release

# Push a tag vX.Y.Z (equal to mod.version in stonecutter.properties.toml) to release:
#   1. build every target listed in stonecutter.properties.toml (every [<loader>."<mc>"] table);
#   2. a GitHub Release with all jars, SHA256SUMS and RELEASE_NOTES/vX.Y.Z.md;
#   3. each jar to Modrinth and CurseForge as its own version, with its loaders, game versions
#      (mod.mc_releases of its node), Java and dependencies. A platform is skipped unless both its
#      token secret and its project id variable are set (MODRINTH_TOKEN + vars.MODRINTH_ID,
#      CURSEFORGE_TOKEN + vars.CURSEFORGE_ID), so a release without them stays GitHub-only.
# Nothing here names the mod or its versions: the same file works in every Farmstead mod. A new
# Minecraft version only needs its node in settings.gradle.kts and stonecutter.properties.toml.
# Run it by hand (Actions -> Release -> Run workflow) for a dry run: build and plan, no uploads.
# The catalogue projects are created by hand once (listing/LISTING.md); CI only adds versions.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and plan only: no GitHub Release, no uploads"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.plan.outputs.version }}
      name: ${{ steps.plan.outputs.name }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan (version, targets)
        id: plan
        shell: python3 {0}
        run: |
          import json, os, sys, tomllib
          props = tomllib.load(open("stonecutter.properties.toml", "rb"))
          mod = props["mod"]
          version = mod["version"]
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ["GITHUB_EVENT_NAME"] == "push" and ref.lstrip("v") != version:
              print(f"::error::tag {ref} does not match mod.version {version} in stonecutter.properties.toml")
              sys.exit(1)

          def mc_key(v):
              return tuple(int(x) for x in v.split("."))

          def java(mc):
              k = mc_key(mc)
              return 25 if k[0] >= 26 else 21 if k >= (1, 20, 5) else 17 if k >= (1, 18) else 8

          names = {"fabric": "Fabric", "forge": "Forge", "neoforge": "NeoForge"}
          targets = []
          for loader in names:
              for mc in props.get(loader, {}):
                  games = props.get(mc, {}).get("mod", {}).get("mc_releases", [mc])
                  targets.append({
                      "mc": mc,
                      "loader": loader,
                      "loaders": "fabric quilt" if loader == "fabric" else loader,
                      "games": " ".join(games),
                      "java": java(mc),
                      "title": f"{names[loader]} {mc}",
                  })
          targets.sort(key=lambda t: (mc_key(t["mc"]), t["loader"]))
          print(f"{len(targets)} targets:")
          for t in targets:
              print(f"  {t['title']:<20} games {t['games']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"name={mod['name']}\n")
              out.write(f"file={mod.get('file', mod['id'])}\n")
              out.write(f"count={len(targets)}\n")
              out.write(f"matrix={json.dumps({'include': targets})}\n")

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Language files
        run: |
          if [ -f tools/lang.py ]; then python3 tools/lang.py --check; fi

      - name: Build all targets
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Collect jars
        run: |
          mkdir dist
          cp versions/*/build/libs/${{ steps.plan.outputs.file }}-*.jar dist/
          rm -f dist/*-sources.jar
          ls -la dist
          test "$(ls dist | wc -l)" -eq "${{ steps.plan.outputs.count }}"

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 3

  github:
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          cd dist && sha256sum *.jar > SHA256SUMS && cd ..
          NOTES="RELEASE_NOTES/v${VERSION}.md"
          [ -f "$NOTES" ] || { echo "${NAME} ${VERSION}." > notes.md; NOTES=notes.md; }
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "v${VERSION}" --title "${NAME} ${VERSION}" --notes-file "$NOTES" $PRE dist/*

  catalogues:
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # one upload at a time keeps the platforms' rate limits happy
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    # job-level env, because a step's `if:` cannot read secrets directly
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
      CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
      VERSION: ${{ needs.build.outputs.version }}
      NAME: ${{ needs.build.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: dist

      - name: Version details
        id: d
        run: |
          FILE=$(ls dist/*-${{ matrix.loader }}-${VERSION}+${{ matrix.mc }}.jar)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          case "$VERSION" in *-alpha*) T=alpha;; *-*) T=beta;; *) T=release;; esac
          echo "type=$T" >> "$GITHUB_OUTPUT"
          NOTES="RELEASE_NOTES/v${VERSION}.md"
          [ -f "$NOTES" ] || { echo "${NAME} ${VERSION}." > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.loader }}" = fabric ]; then
            {
              echo "deps<<EOF"
              echo "modmenu(optional){modrinth:mOgUt4GM}{curseforge:308702}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "deps=" >> "$GITHUB_OUTPUT"
          fi

      - name: Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_ID != ''
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.d.outputs.file }}
          name: ${{ env.NAME }} ${{ env.VERSION }} (${{ matrix.title }})
          version: ${{ env.VERSION }}+${{ matrix.mc }}-${{ matrix.loader }}
          version-type: ${{ steps.d.outputs.type }}
          changelog-file: ${{ steps.d.outputs.notes }}
          loaders: ${{ matrix.loaders }}
          game-versions: ${{ matrix.games }}
          java: ${{ matrix.java }}
          dependencies: ${{ steps.d.outputs.deps }}

      - name: CurseForge
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_ID != ''
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.d.outputs.file }}
          name: ${{ env.NAME }} ${{ env.VERSION }} (${{ matrix.title }})
          version: ${{ env.VERSION }}+${{ matrix.mc }}-${{ matrix.loader }}
          version-type: ${{ steps.d.outputs.type }}
          changelog-file: ${{ steps.d.outputs.notes }}
          loaders: ${{ matrix.loaders }}
          game-versions: ${{ matrix.games }}
          java: ${{ matrix.java }}
          dependencies: ${{ steps.d.outputs.deps }}
