license = "MIT"

modLoader = "javafml"
loaderVersion = "[47,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Farmstead"
description = '''The world remembers your steps: footprints in snow, sand and mud, mob tracks, wet prints and trails worn into the grass. Client-side.'''
logoFile = "assets/imprint/icon.png"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
