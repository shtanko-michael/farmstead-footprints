license = "MIT"
issueTrackerURL = "${issues}"

modLoader = "javafml"
loaderVersion = "[47,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Farmstead"
displayURL = "${homepage}"
description = '''Realistic footprints for players and mobs: pressed into snow, sand, mud, gravel and soil, lit like the ground around them, fading with time. Client-side.'''
logoFile = "assets/farmstead_footprints/icon.png"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
