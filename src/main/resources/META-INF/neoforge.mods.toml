license = "MIT"
issueTrackerURL = "${issues}"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Farmstead"
displayURL = "${homepage}"
description = '''Realistic footprints for players and mobs: pressed into snow, sand, mud, gravel and soil, lit like the ground around them, fading with time. Client-side.'''
${icon_key} = "assets/farmstead_footprints/icon.png"
# Client-side mod: servers do not need it, clients without it can still join servers that have it
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "farmstead_footprints.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
