license = "MIT"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Farmstead"
description = '''The world remembers your steps: footprints in snow, sand and mud, mob tracks, wet prints and trails worn into the grass. Client-side.'''
${icon_key} = "assets/imprint/icon.png"
# Client-side mod: servers do not need it, clients without it can still join servers that have it
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "imprint.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
